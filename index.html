<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吸入器流量監測系統 · 入口</title>
    <!-- Font Awesome 6 (免費) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .login-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.8rem 2.8rem 2.8rem 2.8rem;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: all 0.2s ease;
        }

        /* header */
        .app-header {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-bottom: 2.5rem;
        }

        .app-header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #0b2b44;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-header h1 i {
            color: #1f6e8c;
            font-size: 2rem;
        }

        .app-header .sub {
            font-size: 1rem;
            color: #4a5f73;
            font-weight: 400;
            margin-left: 4px;
            border-left: 3px solid #8ba0b5;
            padding-left: 16px;
        }

        /* 工具網格 */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0 1.8rem;
        }

        .tool-card {
            background: white;
            border-radius: 28px;
            padding: 1.8rem 1.2rem 1.5rem 1.2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0,20,40,0.04);
            border: 1px solid rgba(200, 212, 225, 0.4);
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            text-decoration: none;
            color: #1a2e3f;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
            position: relative;
        }

        .tool-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px -8px rgba(18, 52, 77, 0.15);
            border-color: #b8cedf;
            background: #fbfdff;
        }

        .tool-card .icon {
            font-size: 2.4rem;
            color: #1f6e8c;
            background: #e3edf5;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .tool-card h3 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #0b2b44;
        }

        .tool-card p {
            font-size: 0.9rem;
            color: #5a6f82;
            line-height: 1.4;
            margin: 0;
            flex: 1;
        }

        .tool-card .badge {
            background: #eef3f8;
            color: #1f5a78;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            letter-spacing: 0.02em;
            margin-top: 0.3rem;
            text-transform: uppercase;
        }

        .tool-card .arrow {
            align-self: flex-end;
            color: #8aa3b9;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .tool-card:hover .arrow {
            color: #1f6e8c;
            transform: translateX(4px);
        }

        /* 狀態 / 底部 */
        .footer-note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(160, 184, 204, 0.25);
            color: #4b657b;
            font-size: 0.9rem;
        }

        .footer-note .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #3d9970;
            border-radius: 20px;
            margin-right: 8px;
            box-shadow: 0 0 0 2px rgba(61, 153, 112, 0.2);
        }

        .footer-note i {
            margin-right: 6px;
            color: #578197;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .login-card {
                padding: 1.8rem 1.2rem;
                border-radius: 32px;
            }
            .app-header h1 {
                font-size: 1.6rem;
                flex-wrap: wrap;
            }
            .app-header .sub {
                font-size: 0.9rem;
                border-left: none;
                padding-left: 0;
                margin-left: 0;
            }
            .tool-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
            .tool-card {
                padding: 1.2rem 0.8rem;
            }
            .tool-card .icon {
                width: 44px;
                height: 44px;
                font-size: 1.8rem;
            }
            .tool-card h3 {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 420px) {
            .tool-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="login-card" role="main">

    <!-- 頁首 -->
    <div class="app-header">
        <h1>
            <i class="fas fa-lungs" aria-hidden="true"></i>
            吸入器流量監測 · 入口
        </h1>
        <div class="sub">
            <i class="fas fa-microchip" style="margin-right: 6px; opacity:0.7;"></i>
            聲學氣流可視化 · 四個工具集中存取
        </div>
    </div>

    <!-- 四大工具卡片 -->
    <div class="tool-grid">

        <!-- 1. Inhaler Flow Monitor (基礎版) -->
        <a href="https://inhaler-flow.vercel.app/" target="_blank" rel="noopener noreferrer" class="tool-card">
            <div class="icon"><i class="fas fa-chart-line"></i></div>
            <h3>基礎流量監測</h3>
            <p>即時流量波形 · 理想目標曲線</p>
            <span class="badge"><i class="far fa-clock" style="margin-right: 4px;"></i> V1.2</span>
            <span class="arrow"><i class="fas fa-arrow-right"></i></span>
        </a>

        <!-- 2. 肺部沉積 (Respimat) -->
        <a href="https://respimat.vercel.app/" target="_blank" rel="noopener noreferrer" class="tool-card">
            <div class="icon"><i class="fas fa-wind"></i></div>
            <h3>Respimat 沉積</h3>
            <p>FFT 冪律模型 · 高頻能量分析</p>
            <span class="badge"><i class="fas fa-cog" style="margin-right: 4px;"></i> 無 ML</span>
            <span class="arrow"><i class="fas fa-arrow-right"></i></span>
        </a>

        <!-- 3. 肺部沉積 (Turbuhaler) -->
        <a href="https://trubuhaler.vercel.app/" target="_blank" rel="noopener noreferrer" class="tool-card">
            <div class="icon"><i class="fas fa-lungs-v"></i></div>
            <h3>Turbuhaler 沉積</h3>
            <p>BUDLD 模型 · 肺部圖示填色</p>
            <span class="badge"><i class="fas fa-calculator"></i> Eq 2.9</span>
            <span class="arrow"><i class="fas fa-arrow-right"></i></span>
        </a>

        <!-- 4. 流量監測 (進階版) -->
        <a href="https://fictional-invention-jet.vercel.app/" target="_blank" rel="noopener noreferrer" class="tool-card">
            <div class="icon"><i class="fas fa-wave-square"></i></div>
            <h3>進階流量監測</h3>
            <p>增強濾波 · 滑動視窗多數決</p>
            <span class="badge"><i class="fas fa-filter"></i> 降噪</span>
            <span class="arrow"><i class="fas fa-arrow-right"></i></span>
        </a>

    </div>

    <!-- 底部資訊 -->
    <div class="footer-note">
        <span>
            <span class="status-dot"></span>
            系統就緒 · 點擊卡片開啟工具
        </span>
        <span>
            <i class="fas fa-shield-alt"></i>
            每個工具獨立運行
            <i class="fas fa-arrow-right" style="margin-left: 10px; opacity:0.5;"></i>
            <span style="margin-left: 6px; font-weight: 300; color: #3b5e77;">vercel 部署</span>
        </span>
    </div>

</div>

<!-- 極簡腳本：無侵入，僅作視覺提示 (可省略) -->
<script>
    (function() {
        // 卡片點擊時可增加微量回饋 (不影響連結行為)
        const cards = document.querySelectorAll('.tool-card');
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                // 純粹視覺點擊回饋 (不干擾導航)
                this.style.transition = 'transform 0.1s';
                this.style.transform = 'scale(0.97)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
            });
        });
    })();
</script>

</body>
</html>
