<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吸入器流量監測 · 入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }
        .app-wrapper { max-width: 1100px; margin: 0 auto; }
        .login-card {
            width: 100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.2rem 2.5rem 2rem;
            box-shadow: 0 30px 60px -20px rgba(0,20,40,0.4), 0 0 0 1px rgba(255,255,255,0.6) inset;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
        }
        .app-header .left { display: flex; flex-direction: column; gap: 2px; }
        .app-header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b2b44;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header h1 i { color: #1f6e8c; font-size: 1.8rem; }
        .app-header .sub { font-size: 0.95rem; color: #4a5f73; padding-left: 4px; }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-actions button {
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-add-folder { background: #e8edf3; color: #1f4e79; }
        .btn-add-folder:hover { background: #d5dee8; }
        .btn-add-link { background: #1f4e79; color: white; }
        .btn-add-link:hover { background: #163d5e; }
        .btn-sync {
            background: #e3f2fd;
            color: #1565c0;
        }
        .btn-sync:hover { background: #bbdefb; }
        .btn-sync.syncing {
            opacity: 0.6;
            pointer-events: none;
        }
        .btn-sync .fa-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-reset { background: #f0f0f0; color: #7a8a9a; }
        .btn-reset:hover { background: #e0e0e0; }
        .sync-status {
            font-size: 12px;
            color: #7a8a9a;
            background: #f0f4f8;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .sync-status.success { background: #e8f5e9; color: #2e7d32; }
        .sync-status.error { background: #fde8e8; color: #c0392b; }
        .sync-status.syncing { background: #fff3cd; color: #856404; }
        .last-sync-time {
            font-size: 11px;
            color: #8a9aa8;
            margin-left: 6px;
        }
        .folder {
            background: rgba(255,255,255,0.5);
            border-radius: 24px;
            padding: 16px 18px 14px;
            border: 1px solid rgba(200,212,225,0.3);
            margin-bottom: 1.2rem;
        }
        .folder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .folder-header .left { display: flex; align-items: center; gap: 10px; }
        .folder-header .folder-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a2e3f;
            background: transparent;
            border: none;
            outline: none;
            padding: 2px 8px;
            border-radius: 6px;
            min-width: 60px;
        }
        .folder-header .folder-name:hover { background: rgba(0,0,0,0.04); }
        .folder-header .folder-name:focus { background: white; box-shadow: 0 0 0 2px #1f4e79; }
        .folder-header .folder-count { font-size: 13px; color: #7a8a9a; margin-left: 4px; }
        .folder-header .folder-actions { display: flex; gap: 6px; }
        .folder-header .folder-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #8a9aa8;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.15s;
        }
        .folder-header .folder-actions button:hover { background: rgba(0,0,0,0.06); color: #1f4e79; }
        .folder-header .folder-actions .del-folder:hover { color: #c0392b; }
        .folder-body {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .tool-card {
            background: white;
            border-radius: 20px;
            padding: 1.2rem 1rem 1rem;
            border: 1px solid rgba(200,212,225,0.35);
            transition: 0.2s;
            text-decoration: none;
            color: #1a2e3f;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px -8px rgba(18,52,77,0.12);
            border-color: #b8cedf;
        }
        .tool-card .icon {
            font-size: 1.8rem;
            color: #1f6e8c;
            background: #e3edf5;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            margin-bottom: 8px;
        }
        .tool-card .card-name {
            font-size: 1.05rem;
            font-weight: 600;
            background: transparent;
            border: none;
            outline: none;
            padding: 2px 6px;
            border-radius: 4px;
            width: 100%;
            color: #0b2b44;
        }
        .tool-card .card-name:hover { background: rgba(0,0,0,0.04); }
        .tool-card .card-name:focus { background: white; box-shadow: 0 0 0 2px #1f4e79; }
        .tool-card .card-url {
            font-size: 0.7rem;
            color: #8a9aa8;
            margin: 2px 0 6px;
            word-break: break-all;
            padding: 0 6px;
            background: transparent;
            border: none;
            outline: none;
            border-radius: 4px;
        }
        .tool-card .card-url:hover { background: rgba(0,0,0,0.03); }
        .tool-card .card-url:focus { background: white; box-shadow: 0 0 0 2px #1f4e79; }
        .tool-card .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            justify-content: flex-end;
        }
        .tool-card .card-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #8a9aa8;
            font-size: 13px;
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.15s;
        }
        .tool-card .card-actions button:hover { background: rgba(0,0,0,0.06); }
        .tool-card .card-actions .del-card:hover { color: #c0392b; }
        .tool-card .card-actions .open-link { color: #1f6e8c; font-weight: 600; }
        .tool-card .card-actions .open-link:hover { background: #e3edf5; }
        .uncategorized {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .uncategorized .tool-card { background: white; border-radius: 20px; padding: 1.2rem 1rem 1rem; border: 1px solid rgba(200,212,225,0.35); transition: 0.2s; text-decoration: none; color: #1a2e3f; display: flex; flex-direction: column; position: relative; }
        .uncategorized .tool-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px -8px rgba(18,52,77,0.12); border-color: #b8cedf; }
        .empty-hint { color: #8a9aa8; font-size: 14px; padding: 20px 0 10px; text-align: center; }
        .footer-note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(160,184,204,0.25);
            color: #4b657b;
            font-size: 0.9rem;
        }
        .footer-note .status-dot { display: inline-block; width: 10px; height: 10px; background: #3d9970; border-radius: 20px; margin-right: 8px; box-shadow: 0 0 0 2px rgba(61,153,112,0.2); }
        .footer-note .badge-version { background: #eef3f8; padding: 2px 14px; border-radius: 30px; font-size: 12px; color: #4a5f73; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2.2rem;
            max-width: 460px;
            width: 92%;
            box-shadow: 0 40px 80px rgba(0,0,0,0.25);
        }
        .modal-box h3 { font-size: 1.3rem; color: #0b2b44; margin-bottom: 6px; }
        .modal-box .sub { color: #7a8a9a; font-size: 14px; margin-bottom: 18px; }
        .modal-box label { font-size: 13px; font-weight: 500; color: #2c3e50; display: block; margin-top: 12px; }
        .modal-box input, .modal-box select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #d0d8e0;
            font-size: 14px;
            margin-top: 4px;
            outline: none;
            transition: 0.15s;
        }
        .modal-box input:focus, .modal-box select:focus { border-color: #1f4e79; box-shadow: 0 0 0 3px rgba(31,78,121,0.1); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-actions .btn-cancel { background: #f0f0f0; color: #5a6a7a; }
        .modal-actions .btn-cancel:hover { background: #e0e0e0; }
        .modal-actions .btn-confirm { background: #1f4e79; color: white; }
        .modal-actions .btn-confirm:hover { background: #163d5e; }
        .fix-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 16px;
            color: #856404;
            font-size: 14px;
            display: none;
        }
        .fix-notice.show { display: block; }
        @media (max-width: 700px) {
            .login-card { padding: 1.5rem 1.2rem; border-radius: 32px; }
            .app-header { flex-direction: column; align-items: stretch; gap: 12px; }
            .header-actions { justify-content: flex-start; }
            .app-header h1 { font-size: 1.5rem; }
            .folder-body { grid-template-columns: 1fr 1fr; }
            .uncategorized { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 440px) {
            .folder-body { grid-template-columns: 1fr; }
            .uncategorized { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">

<div class="login-card" id="appRoot">
    <div class="app-header">
        <div class="left">
            <h1><i class="fas fa-lungs"></i> 吸入器流量監測 · 入口</h1>
            <span class="sub"><i class="fas fa-cloud" style="margin-right:6px;opacity:0.7;"></i>雲端同步版 · 手動同步</span>
        </div>
        <div class="header-actions">
            <button class="btn-add-folder" onclick="App.addFolder()"><i class="fas fa-folder-plus"></i> 分類</button>
            <button class="btn-add-link" onclick="App.addLink()"><i class="fas fa-plus-circle"></i> 視窗</button>
            <button class="btn-sync" id="syncBtn" onclick="App.syncToCloud()"><i class="fas fa-cloud-upload-alt"></i> 同步到雲端</button>
            <button class="btn-sync" id="loadBtn" onclick="App.loadFromCloud()"><i class="fas fa-cloud-download-alt"></i> 從雲端載入</button>
            <button class="btn-reset" onclick="App.resetAll()"><i class="fas fa-undo-alt"></i> 重置</button>
        </div>
    </div>

    <div class="fix-notice" id="fixNotice"></div>
    <div id="toolContainer"></div>

    <div class="footer-note">
        <span>
            <span class="status-dot"></span>
            點擊名稱可重新命名
            <span class="sync-status" id="syncStatus">📡 已就緒</span>
            <span class="last-sync-time" id="lastSyncTime"></span>
        </span>
        <span>
            <i class="fas fa-cloud"></i>
            資料儲存於 Supabase
            <span class="badge-version">v5.0</span>
        </span>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h3 id="modalTitle">新增視窗</h3>
        <div class="sub" id="modalSub">請輸入名稱與網址</div>
        <label>名稱</label>
        <input id="modalName" placeholder="例如：基礎流量監測" />
        <label id="urlLabel">網址 (URL)</label>
        <input id="modalUrl" placeholder="https://example.com" />
        <label>分類 (可選)</label>
        <select id="modalFolder"><option value="">— 不分類 —</option></select>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="App.closeModal()">取消</button>
            <button class="btn-confirm" id="modalConfirmBtn" onclick="App.confirmModal()">新增</button>
        </div>
    </div>
</div>

<script>
// ============================================================
//  Log 功能
// ============================================================
async function sendLog(action, data = {}) {
    try {
        const response = await fetch('/api/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: action,
                data: data,
                url: window.location.href,
                timestamp: new Date().toISOString()
            })
        });
        const result = await response.json();
        console.log('✅ Log 已發送:', action, result);
    } catch (e) {
        console.log('⚠️ Log 發送失敗（不影響主功能）:', e.message);
    }
}

// ============================================================
//  設定 Supabase
// ============================================================
const SUPABASE_URL = 'https://xkuipukvpgglwnonmjbc.supabase.co/rest/v1/';
const SUPABASE_KEY = 'sb_publishable_SBtHX0AudJ9f08ZE6SY4hQ_9T1jHKb9';
const TABLE = 'portal_data';

// ============================================================
//  App 核心 — 手動同步版
// ============================================================
const App = {
    data: null,
    defaultData: null,
    _modalMode: 'link',
    _modalFolderKey: null,
    _isSyncing: false,
    _recordId: null,
    _lastSyncTime: null,

    // ----- 預設資料 -----
    setDefaultData() {
        this.data = {
            folders: {
                "流量監測": {
                    name: "流量監測",
                    items: [
                        { id: 1, name: "基礎流量監測", url: "https://inhaler-flow.vercel.app/", icon: "chart-line" },
                        { id: 2, name: "進階流量監測", url: "https://fictional-invention-jet.vercel.app/", icon: "wave-square" },
                    ]
                },
                "肺部沉積": {
                    name: "肺部沉積",
                    items: [
                        { id: 3, name: "Respimat 沉積", url: "https://respimat.vercel.app/", icon: "wind" },
                        { id: 4, name: "Turbuhaler 沉積", url: "https://trubuhaler.vercel.app/", icon: "lungs-v" },
                    ]
                },
                "其他工具": {
                    name: "其他工具",
                    items: [
                        { id: 5, name: "Ellita 流量監測", url: "https://ellita.vercel.app/", icon: "microchip" },
                        { id: 6, name: "呼吸太鼓達人", url: "https://inhaler-flow-59pm.vercel.app/", icon: "gamepad" },
                    ]
                }
            },
            uncategorized: [],
            nextId: 7,
        };
    },

    // ----- 初始化 -----
    init() {
        this.setDefaultData();
        this.defaultData = JSON.parse(JSON.stringify(this.data));
        this.render();
        this.updateModalFolderSelect();
        this._setupModalClose();

        // 載入上次同步時間
        const saved = localStorage.getItem('portal_last_sync');
        if (saved) {
            this._lastSyncTime = saved;
            this._updateLastSyncTime();
        }

        // 嘗試從雲端載入（非強制）
        this.loadFromCloud(true);
        sendLog('頁面載入', { version: '5.0', type: '入口網站' });
    },

    _setSyncStatus(text, type) {
        const el = document.getElementById('syncStatus');
        el.textContent = text;
        el.className = 'sync-status';
        if (type) el.classList.add(type);
    },

    _updateLastSyncTime() {
        const el = document.getElementById('lastSyncTime');
        if (this._lastSyncTime) {
            const d = new Date(this._lastSyncTime);
            el.textContent = `上次同步: ${d.toLocaleString()}`;
        } else {
            el.textContent = '';
        }
    },

    _showFixNotice(msg) {
        const el = document.getElementById('fixNotice');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 5000);
    },

    // ----- 從雲端載入（手動） -----
    async loadFromCloud(silent = false) {
        if (this._isSyncing) return;
        this._isSyncing = true;

        const syncBtn = document.getElementById('loadBtn');
        syncBtn.classList.add('syncing');
        syncBtn.innerHTML = '<i class="fas fa-spinner fa-spinner"></i> 載入中...';

        if (!silent) this._setSyncStatus('⏳ 載入中...', 'syncing');

        try {
            const response = await fetch(SUPABASE_URL + TABLE + '?select=id,data,updated_at', {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY
                }
            });

            if (!response.ok) {
                if (response.status === 404) {
                    if (!silent) this._setSyncStatus('📡 雲端尚無資料', '');
                    this._showFixNotice('⚠️ 雲端尚無資料，請先「同步到雲端」');
                    return;
                }
                throw new Error(`HTTP ${response.status}`);
            }

            const result = await response.json();
            if (result && result.length > 0) {
                const record = result[0];
                this._recordId = record.id;

                if (record.data) {
                    const cloudData = record.data;
                    if (!cloudData.folders) cloudData.folders = {};
                    if (!cloudData.uncategorized) cloudData.uncategorized = [];
                    if (!cloudData.nextId || cloudData.nextId < 1) cloudData.nextId = 7;

                    // 詢問是否覆蓋本地資料
                    if (!silent) {
                        if (!confirm('從雲端載入會覆蓋本地的所有變更，確定要繼續嗎？')) {
                            this._isSyncing = false;
                            syncBtn.classList.remove('syncing');
                            syncBtn.innerHTML = '<i class="fas fa-cloud-download-alt"></i> 從雲端載入';
                            return;
                        }
                    }

                    this.data = cloudData;
                    this._lastSyncTime = record.updated_at || new Date().toISOString();
                    localStorage.setItem('portal_last_sync', this._lastSyncTime);
                    this._updateLastSyncTime();
                    this.render();
                    this.updateModalFolderSelect();

                    if (!silent) {
                        this._setSyncStatus('✅ 已載入雲端', 'success');
                        this._showFixNotice('📥 已從雲端載入最新資料');
                    } else {
                        this._setSyncStatus('✅ 已同步', 'success');
                    }
                    console.log('✅ 從 Supabase 載入成功');
                }
            } else {
                if (!silent) this._setSyncStatus('📡 雲端尚無資料', '');
                this._showFixNotice('⚠️ 雲端尚無資料，請先「同步到雲端」');
            }
        } catch (error) {
            console.warn('⚠️ 載入雲端失敗:', error);
            if (!silent) {
                this._setSyncStatus('⚠️ 載入失敗', 'error');
                this._showFixNotice('❌ 載入失敗：' + error.message);
            }
            sendLog('載入雲端失敗', { error: error.message });
        } finally {
            this._isSyncing = false;
            syncBtn.classList.remove('syncing');
            syncBtn.innerHTML = '<i class="fas fa-cloud-download-alt"></i> 從雲端載入';
        }
    },

    // ----- 同步到雲端（手動） -----
    async syncToCloud(silent = false) {
        if (this._isSyncing) return;
        this._isSyncing = true;

        const syncBtn = document.getElementById('syncBtn');
        syncBtn.classList.add('syncing');
        syncBtn.innerHTML = '<i class="fas fa-spinner fa-spinner"></i> 同步中...';

        if (!silent) this._setSyncStatus('⏳ 同步中...', 'syncing');

        try {
            let url = SUPABASE_URL + TABLE;
            let method = 'POST';
            let body = { data: this.data };

            // 檢查是否有現有記錄
            const checkRes = await fetch(SUPABASE_URL + TABLE + '?select=id', {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY
                }
            });
            const existing = await checkRes.json();

            if (existing && existing.length > 0) {
                this._recordId = existing[0].id;
                url = SUPABASE_URL + TABLE + '?id=eq.' + this._recordId;
                method = 'PATCH';
                body = { data: this.data };
            }

            const response = await fetch(url, {
                method: method,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            this._lastSyncTime = new Date().toISOString();
            localStorage.setItem('portal_last_sync', this._lastSyncTime);
            this._updateLastSyncTime();

            if (!silent) {
                this._setSyncStatus('✅ 已同步', 'success');
                this._showFixNotice('✅ 資料已同步到雲端！');
            }
            console.log('✅ 同步成功');
            sendLog('同步成功', { recordId: this._recordId });

        } catch (error) {
            console.error('❌ 同步失敗:', error);
            if (!silent) {
                this._setSyncStatus('❌ 同步失敗', 'error');
                this._showFixNotice('❌ 同步失敗：' + error.message);
            }
            sendLog('同步失敗', { error: error.message });
        } finally {
            this._isSyncing = false;
            syncBtn.classList.remove('syncing');
            syncBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> 同步到雲端';
        }
    },

    // ----- 內部輔助函數 -----
    _nextId() {
        return this.data.nextId++;
    },

    _findItem(id) {
        let idx = this.data.uncategorized.findIndex(i => i.id === id);
        if (idx !== -1) return { location: 'uncategorized', index: idx, item: this.data.uncategorized[idx] };
        for (const key of Object.keys(this.data.folders)) {
            const folder = this.data.folders[key];
            const i = folder.items.findIndex(it => it.id === id);
            if (i !== -1) return { location: 'folder', folderKey: key, index: i, item: folder.items[i] };
        }
        return null;
    },

    _escape(str) {
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    },

    // ----- 渲染 -----
    render() {
        const container = document.getElementById('toolContainer');
        const data = this.data;
        let html = '';

        const folderKeys = Object.keys(data.folders);
        if (folderKeys.length > 0) {
            for (const key of folderKeys) {
                html += this._renderFolder(data.folders[key]);
            }
        }

        if (data.uncategorized.length > 0) {
            html += `
                <div class="folder">
                    <div class="folder-header">
                        <div class="left">
                            <span style="font-size:1.1rem;font-weight:600;color:#1a2e3f;">📂 未分類</span>
                            <span class="folder-count">(${data.uncategorized.length})</span>
                        </div>
                    </div>
                    <div class="uncategorized">
                        ${data.uncategorized.map(item => this._renderCard(item, null)).join('')}
                    </div>
                </div>
            `;
        }

        if (folderKeys.length === 0 && data.uncategorized.length === 0) {
            html = `<div class="empty-hint"><i class="fas fa-plus-circle" style="font-size:2rem;color:#c0d0dc;display:block;margin-bottom:8px;"></i>點擊「新增視窗」或「新增分類」開始建立您的工具集</div>`;
        }

        container.innerHTML = html;
        this.updateModalFolderSelect();
    },

    _renderFolder(folder) {
        const key = folder.name;
        const count = folder.items.length;
        return `
            <div class="folder" data-folder="${key}">
                <div class="folder-header">
                    <div class="left">
                        <span style="font-size:1.2rem;">📁</span>
                        <input class="folder-name" value="${this._escape(key)}" 
                               onchange="App.renameFolder('${this._escape(key)}', this.value)" 
                               onfocus="this.select()" />
                        <span class="folder-count">(${count})</span>
                    </div>
                    <div class="folder-actions">
                        <button onclick="App.addLinkToFolder('${this._escape(key)}')" title="在此分類新增視窗"><i class="fas fa-plus"></i></button>
                        <button class="del-folder" onclick="App.deleteFolder('${this._escape(key)}')" title="刪除分類"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
                <div class="folder-body">
                    ${folder.items.map(item => this._renderCard(item, key)).join('')}
                    ${folder.items.length === 0 ? '<div style="color:#b0c0cc;font-size:13px;padding:12px 0;grid-column:1/-1;text-align:center;">此分類尚無項目</div>' : ''}
                </div>
            </div>
        `;
    },

    _renderCard(item, folderKey) {
        const icon = item.icon || 'globe';
        return `
            <div class="tool-card" data-id="${item.id}" data-folder="${folderKey || ''}">
                <div class="icon"><i class="fas fa-${icon}"></i></div>
                <input class="card-name" value="${this._escape(item.name)}" 
                       onchange="App.renameItem(${item.id}, this.value)" 
                       onfocus="this.select()" />
                <input class="card-url" value="${this._escape(item.url)}" 
                       onchange="App.updateUrl(${item.id}, this.value)" 
                       onfocus="this.select()" placeholder="網址..." />
                <div class="card-actions">
                    <button class="open-link" onclick="App.openLink(${item.id})" title="在新分頁開啟"><i class="fas fa-external-link-alt"></i> 開啟</button>
                    <button class="del-card" onclick="App.deleteItem(${item.id})" title="刪除"><i class="fas fa-times"></i></button>
                </div>
            </div>
        `;
    },

    // ----- 新增 -----
    addLink() {
        this._openModal('新增視窗', '請輸入名稱與網址', 'link');
        sendLog('開啟新增視窗');
    },

    addLinkToFolder(folderKey) {
        this._openModal(`新增視窗至「${folderKey}」`, '請輸入名稱與網址', 'link', folderKey);
        sendLog('開啟新增視窗', { folder: folderKey });
    },

    addFolder() {
        this._openModal('新增分類', '請輸入分類名稱', 'folder');
        sendLog('開啟新增分類');
    },

    _openModal(title, sub, mode, folderKey) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalSub').textContent = sub;
        document.getElementById('modalName').value = '';
        document.getElementById('modalUrl').value = '';
        const isFolder = mode === 'folder';
        document.getElementById('modalUrl').style.display = isFolder ? 'none' : 'block';
        document.getElementById('urlLabel').style.display = isFolder ? 'none' : 'block';
        this.updateModalFolderSelect(folderKey);
        document.getElementById('modalOverlay').classList.add('active');
        this._modalMode = mode;
        this._modalFolderKey = folderKey || null;
        document.getElementById('modalConfirmBtn').textContent = isFolder ? '建立分類' : '新增';
        setTimeout(() => document.getElementById('modalName').focus(), 100);
    },

    closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
    },

    confirmModal() {
        const name = document.getElementById('modalName').value.trim();
        const url = document.getElementById('modalUrl').value.trim();
        const folder = document.getElementById('modalFolder').value;

        if (!name) { alert('請輸入名稱'); return; }

        if (this._modalMode === 'folder') {
            if (this.data.folders[name]) {
                alert(`分類「${name}」已存在`);
                return;
            }
            this.data.folders[name] = { name: name, items: [] };
            this.render();
            this.closeModal();
            sendLog('新增分類', { name });
            return;
        }

        if (!url) { alert('請輸入網址'); return; }
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            alert('請輸入有效的網址 (需以 http:// 或 https:// 開頭)');
            return;
        }

        const newItem = { id: this._nextId(), name: name, url: url, icon: 'globe' };

        if (folder && this.data.folders[folder]) {
            this.data.folders[folder].items.push(newItem);
        } else {
            this.data.uncategorized.push(newItem);
        }

        this.render();
        this.closeModal();
        sendLog('新增視窗', { name, url, folder: folder || '未分類' });
    },

    // ----- 重新命名 -----
    renameItem(id, newName) {
        const found = this._findItem(id);
        if (!found) return;
        if (!newName.trim()) { alert('名稱不能為空'); this.render(); return; }
        found.item.name = newName.trim();
        this.render();
        sendLog('重新命名項目', { id, newName });
    },

    renameFolder(oldKey, newKey) {
        if (!newKey.trim()) { alert('名稱不能為空'); this.render(); return; }
        if (newKey !== oldKey && this.data.folders[newKey]) {
            alert(`分類「${newKey}」已存在`);
            this.render();
            return;
        }
        const folder = this.data.folders[oldKey];
        if (!folder) return;
        delete this.data.folders[oldKey];
        folder.name = newKey.trim();
        this.data.folders[newKey.trim()] = folder;
        this.render();
        sendLog('重新命名分類', { oldKey, newKey });
    },

    updateUrl(id, newUrl) {
        const found = this._findItem(id);
        if (!found) return;
        if (!newUrl.trim()) { alert('網址不能為空'); this.render(); return; }
        if (!newUrl.startsWith('http://') && !newUrl.startsWith('https://')) {
            alert('請輸入有效的網址 (需以 http:// 或 https:// 開頭)');
            this.render();
            return;
        }
        found.item.url = newUrl.trim();
        this.render();
        sendLog('更新網址', { id, newUrl });
    },

    // ----- 刪除 -----
    deleteItem(id) {
        if (!confirm('確定要刪除這個項目嗎？')) return;
        const found = this._findItem(id);
        if (!found) return;
        if (found.location === 'uncategorized') {
            this.data.uncategorized.splice(found.index, 1);
        } else {
            this.data.folders[found.folderKey].items.splice(found.index, 1);
        }
        this.render();
        sendLog('刪除項目', { id });
    },

    deleteFolder(key) {
        if (!confirm(`確定要刪除分類「${key}」嗎？\n裡面的項目將移到「未分類」。`)) return;
        const folder = this.data.folders[key];
        if (!folder) return;
        for (const item of folder.items) {
            this.data.uncategorized.push(item);
        }
        delete this.data.folders[key];
        this.render();
        sendLog('刪除分類', { key });
    },

    // ----- 開啟連結 -----
    openLink(id) {
        const found = this._findItem(id);
        if (!found) return;
        window.open(found.item.url, '_blank');
        sendLog('開啟連結', { id, url: found.item.url });
    },

    // ----- 重置 -----
    resetAll() {
        if (!confirm('確定要還原為預設設定嗎？\n您所有的自訂項目將會遺失！')) return;
        this.setDefaultData();
        this.render();
        this.updateModalFolderSelect();
        this._showFixNotice('✅ 已還原為預設值');
        sendLog('重置為預設');
    },

    // ----- Modal 下拉選單 -----
    updateModalFolderSelect(selected) {
        const sel = document.getElementById('modalFolder');
        const current = sel.value;
        sel.innerHTML = '<option value="">— 不分類 —</option>';
        for (const key of Object.keys(this.data.folders)) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            sel.appendChild(opt);
        }
        if (selected) sel.value = selected;
        else if (current && this.data.folders[current]) sel.value = current;
    },

    // ----- Modal 關閉 -----
    _setupModalClose() {
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) this.closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') this.closeModal();
        });
    },
};

// ============================================================
//  啟動
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    App.init();
});
</script>
</div>
