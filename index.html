<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吸入器流量監測 · 入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 樣式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }
        .app-wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }
        .login-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.2rem 2.5rem 2rem;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
        }
        .app-header .left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .app-header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b2b44;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header h1 i {
            color: #1f6e8c;
            font-size: 1.8rem;
        }
        .app-header .sub {
            font-size: 0.95rem;
            color: #4a5f73;
            padding-left: 4px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-actions button {
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-add-folder {
            background: #e8edf3;
            color: #1f4e79;
        }
        .btn-add-folder:hover {
            background: #d5dee8;
        }
        .btn-add-link {
            background: #1f4e79;
            color: white;
        }
        .btn-add-link:hover {
            background: #163d5e;
        }
        .btn-reset {
            background: #f0f0f0;
            color: #7a8a9a;
        }
        .btn-reset:hover {
            background: #e0e0e0;
        }
        .btn-clear-storage {
            background: #fde8e8;
            color: #c0392b;
        }
        .btn-clear-storage:hover {
            background: #fcd5d5;
        }
        .btn-export {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .btn-export:hover {
            background: #c8e6c9;
        }
        .btn-import {
            background: #e3f2fd;
            color: #1565c0;
        }
        .btn-import:hover {
            background: #bbdefb;
        }
        #importFileInput {
            display: none;
        }
        .tool-grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            margin: 1.5rem 0 1.5rem;
        }
        .folder {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 16px 18px 14px;
            border: 1px solid rgba(200, 212, 225, 0.3);
        }
        .folder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            user-select: none;
        }
        .folder-header .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .folder-header .folder-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a2e3f;
            background: transparent;
            border: none;
            outline: none;
            padding: 2px 8px;
            border-radius: 6px;
            min-width: 60px;
        }
        .folder-header .folder-name:hover {
            background: rgba(0,0,0,0.04);
        }
        .folder-header .folder-name:focus {
            background: white;
            box-shadow: 0 0 0 2px #1f4e79;
        }
        .folder-header .folder-count {
            font-size: 13px;
            color: #7a8a9a;
            margin-left: 4px;
        }
        .folder-header .folder-actions {
            display: flex;
            gap: 6px;
        }
        .folder-header .folder-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #8a9aa8;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.15s;
        }
        .folder-header .folder-actions button:hover {
            background: rgba(0,0,0,0.06);
            color: #1f4e79;
        }
        .folder-header .folder-actions .del-folder:hover {
            color: #c0392b;
        }
        .folder-body {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .folder-body .tool-card,
        .uncategorized .tool-card {
            background: white;
            border-radius: 20px;
            padding: 1.2rem 1rem 1rem;
            border: 1px solid rgba(200, 212, 225, 0.35);
            transition: 0.2s;
            text-decoration: none;
            color: #1a2e3f;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .folder-body .tool-card:hover,
        .uncategorized .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px -8px rgba(18, 52, 77, 0.12);
            border-color: #b8cedf;
        }
        .uncategorized {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .tool-card .icon {
            font-size: 1.8rem;
            color: #1f6e8c;
            background: #e3edf5;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            margin-bottom: 8px;
        }
        .tool-card .card-name {
            font-size: 1.05rem;
            font-weight: 600;
            background: transparent;
            border: none;
            outline: none;
            padding: 2px 6px;
            border-radius: 4px;
            width: 100%;
            color: #0b2b44;
        }
        .tool-card .card-name:hover {
            background: rgba(0,0,0,0.04);
        }
        .tool-card .card-name:focus {
            background: white;
            box-shadow: 0 0 0 2px #1f4e79;
        }
        .tool-card .card-url {
            font-size: 0.7rem;
            color: #8a9aa8;
            margin: 2px 0 6px;
            word-break: break-all;
            padding: 0 6px;
            background: transparent;
            border: none;
            outline: none;
            border-radius: 4px;
        }
        .tool-card .card-url:hover {
            background: rgba(0,0,0,0.03);
        }
        .tool-card .card-url:focus {
            background: white;
            box-shadow: 0 0 0 2px #1f4e79;
        }
        .tool-card .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            justify-content: flex-end;
        }
        .tool-card .card-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #8a9aa8;
            font-size: 13px;
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.15s;
        }
        .tool-card .card-actions button:hover {
            background: rgba(0,0,0,0.06);
        }
        .tool-card .card-actions .del-card:hover {
            color: #c0392b;
        }
        .tool-card .card-actions .open-link {
            color: #1f6e8c;
            font-weight: 600;
        }
        .tool-card .card-actions .open-link:hover {
            background: #e3edf5;
        }
        .empty-hint {
            color: #8a9aa8;
            font-size: 14px;
            padding: 20px 0 10px;
            text-align: center;
        }
        .footer-note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(160, 184, 204, 0.25);
            color: #4b657b;
            font-size: 0.9rem;
        }
        .footer-note .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #3d9970;
            border-radius: 20px;
            margin-right: 8px;
            box-shadow: 0 0 0 2px rgba(61, 153, 112, 0.2);
        }
        .footer-note .badge-version {
            background: #eef3f8;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            color: #4a5f73;
        }
        .storage-status {
            font-size: 12px;
            color: #7a8a9a;
            background: #f0f4f8;
            padding: 2px 12px;
            border-radius: 30px;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2.2rem;
            max-width: 460px;
            width: 92%;
            box-shadow: 0 40px 80px rgba(0,0,0,0.25);
        }
        .modal-box h3 {
            font-size: 1.3rem;
            color: #0b2b44;
            margin-bottom: 6px;
        }
        .modal-box .sub {
            color: #7a8a9a;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .modal-box label {
            font-size: 13px;
            font-weight: 500;
            color: #2c3e50;
            display: block;
            margin-top: 12px;
        }
        .modal-box input, .modal-box select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #d0d8e0;
            font-size: 14px;
            margin-top: 4px;
            outline: none;
            transition: 0.15s;
        }
        .modal-box input:focus, .modal-box select:focus {
            border-color: #1f4e79;
            box-shadow: 0 0 0 3px rgba(31,78,121,0.1);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 8px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-actions .btn-cancel {
            background: #f0f0f0;
            color: #5a6a7a;
        }
        .modal-actions .btn-cancel:hover {
            background: #e0e0e0;
        }
        .modal-actions .btn-confirm {
            background: #1f4e79;
            color: white;
        }
        .modal-actions .btn-confirm:hover {
            background: #163d5e;
        }

        /* ===== 通知 ===== */
        .fix-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 16px;
            color: #856404;
            font-size: 14px;
            display: none;
        }
        .fix-notice.show {
            display: block;
        }
        .fix-notice strong {
            color: #856404;
        }

        @media (max-width: 700px) {
            .login-card { padding: 1.5rem 1.2rem; border-radius: 32px; }
            .app-header { flex-direction: column; align-items: stretch; gap: 12px; }
            .header-actions { justify-content: flex-start; }
            .app-header h1 { font-size: 1.5rem; }
            .folder-body { grid-template-columns: 1fr 1fr; }
            .uncategorized { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 440px) {
            .folder-body { grid-template-columns: 1fr; }
            .uncategorized { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">

<div class="login-card" id="appRoot">
    <!-- 標題列 -->
    <div class="app-header">
        <div class="left">
            <h1><i class="fas fa-lungs"></i> 吸入器流量監測 · 入口</h1>
            <span class="sub"><i class="fas fa-microchip" style="margin-right:6px;opacity:0.7;"></i>聲學氣流可視化 · 可自訂分類</span>
        </div>
        <div class="header-actions">
            <button class="btn-add-folder" onclick="App.addFolder()"><i class="fas fa-folder-plus"></i> 分類</button>
            <button class="btn-add-link" onclick="App.addLink()"><i class="fas fa-plus-circle"></i> 視窗</button>
            <button class="btn-export" onclick="App.exportData()"><i class="fas fa-download"></i> 備份</button>
            <button class="btn-import" onclick="document.getElementById('importFileInput').click()"><i class="fas fa-upload"></i> 還原</button>
            <button class="btn-reset" onclick="App.resetAll()" title="還原為預設"><i class="fas fa-undo-alt"></i></button>
            <button class="btn-clear-storage" onclick="App.clearStorage()" title="清除所有儲存資料"><i class="fas fa-broom"></i> 修復</button>
        </div>
        <input type="file" id="importFileInput" accept=".json" onchange="App.importData(event)" />
    </div>

    <!-- 修復通知 -->
    <div class="fix-notice" id="fixNotice"></div>

    <!-- 工具區域 -->
    <div id="toolContainer"></div>

    <!-- 底部 -->
    <div class="footer-note">
        <span>
            <span class="status-dot"></span>
            點擊名稱可重新命名
            <span class="storage-status" id="storageStatus">✅ 自動儲存中</span>
        </span>
        <span>
            <i class="fas fa-shield-alt"></i>
            資料儲存於瀏覽器
            <span class="badge-version">v2.3</span>
        </span>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h3 id="modalTitle">新增視窗</h3>
        <div class="sub" id="modalSub">請輸入名稱與網址</div>
        <label>名稱</label>
        <input id="modalName" placeholder="例如：基礎流量監測" />
        <label id="urlLabel">網址 (URL)</label>
        <input id="modalUrl" placeholder="https://example.com" />
        <label>分類 (可選)</label>
        <select id="modalFolder"><option value="">— 不分類 —</option></select>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="App.closeModal()">取消</button>
            <button class="btn-confirm" id="modalConfirmBtn" onclick="App.confirmModal()">新增</button>
        </div>
    </div>
</div>

<script>
// ============================================================
//  App 核心 — 含匯入 / 匯出功能
// ============================================================
const App = {
    data: null,
    defaultData: null,
    _modalMode: 'link',
    _modalFolderKey: null,

    // ----- 初始化 -----
    init() {
        let needFix = false;
        let saved = localStorage.getItem('inhaler_portal_data');

        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (typeof parsed !== 'object' || parsed === null) throw new Error('格式錯誤');
                if (!parsed.folders || typeof parsed.folders !== 'object') throw new Error('folders 遺失');
                if (!parsed.uncategorized || !Array.isArray(parsed.uncategorized)) throw new Error('uncategorized 遺失');
                if (typeof parsed.nextId !== 'number' || parsed.nextId < 1) throw new Error('nextId 無效');
                this.data = parsed;
            } catch(e) {
                console.warn('儲存資料損毀，自動修復中...', e);
                needFix = true;
                localStorage.removeItem('inhaler_portal_data');
            }
        }

        if (!this.data) {
            this.setDefaultData();
            if (needFix) {
                this._showFixNotice('🔄 已自動修復儲存資料，恢復為預設值');
            }
        }

        this.defaultData = JSON.parse(JSON.stringify(this.data));
        this.render();
        this.updateModalFolderSelect();
        this._setupModalClose();
        this._updateStorageStatus();
    },

    // ----- 預設資料 -----
    setDefaultData() {
        this.data = {
            folders: {
                "流量監測": {
                    name: "流量監測",
                    items: [
                        { id: 1, name: "基礎流量監測", url: "https://inhaler-flow.vercel.app/", icon: "chart-line" },
                        { id: 2, name: "進階流量監測", url: "https://fictional-invention-jet.vercel.app/", icon: "wave-square" },
                    ]
                },
                "肺部沉積": {
                    name: "肺部沉積",
                    items: [
                        { id: 3, name: "Respimat 沉積", url: "https://respimat.vercel.app/", icon: "wind" },
                        { id: 4, name: "Turbuhaler 沉積", url: "https://trubuhaler.vercel.app/", icon: "lungs-v" },
                    ]
                }
            },
            uncategorized: [],
            nextId: 5,
        };
    },

    // ----- 通知 -----
    _showFixNotice(msg) {
        const el = document.getElementById('fixNotice');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 5000);
    },

    // ----- 儲存狀態 -----
    _updateStorageStatus() {
        const el = document.getElementById('storageStatus');
        try {
            const saved = localStorage.getItem('inhaler_portal_data');
            if (saved) {
                const size = new Blob([saved]).size;
                el.textContent = `✅ 已儲存 (${size} bytes)`;
            } else {
                el.textContent = '⚠️ 無儲存資料';
            }
        } catch(e) {
            el.textContent = '⚠️ 儲存異常';
        }
    },

    // ----- 儲存 -----
    save() {
        try {
            localStorage.setItem('inhaler_portal_data', JSON.stringify(this.data));
            this._updateStorageStatus();
        } catch(e) {
            console.error('儲存失敗:', e);
            this._showFixNotice('❌ 儲存失敗！可能儲存空間已滿。請使用「備份」功能匯出資料後，再點「修復」清除舊資料。');
        }
    },

    // ============================================================
    //  匯出 / 匯入（備份功能）
    // ============================================================
    exportData() {
        try {
            const dataStr = JSON.stringify(this.data, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const date = new Date().toISOString().slice(0, 10);
            a.download = `入口備份_${date}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this._showFixNotice('✅ 備份成功！檔案已下載。');
        } catch(e) {
            alert('匯出失敗: ' + e.message);
        }
    },

    importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                if (!imported.folders || typeof imported.folders !== 'object') {
                    throw new Error('無效的備份檔案：缺少 folders');
                }
                if (!imported.uncategorized || !Array.isArray(imported.uncategorized)) {
                    throw new Error('無效的備份檔案：缺少 uncategorized');
                }
                if (!confirm('確定要還原這個備份嗎？\n目前的資料將會被覆蓋！')) return;
                this.data = imported;
                this.save();
                this.render();
                this.updateModalFolderSelect();
                this._showFixNotice('✅ 還原成功！已載入備份資料。');
            } catch(err) {
                alert('匯入失敗: ' + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // 重置 input
    },

    // ============================================================
    //  以下為原有功能（不變）
    // ============================================================

    _nextId() {
        return this.data.nextId++;
    },

    // ----- 渲染 -----
    render() {
        const container = document.getElementById('toolContainer');
        const data = this.data;
        let html = '';

        const folderKeys = Object.keys(data.folders);
        if (folderKeys.length > 0) {
            for (const key of folderKeys) {
                html += this._renderFolder(data.folders[key]);
            }
        }

        if (data.uncategorized.length > 0) {
            html += `
                <div class="folder">
                    <div class="folder-header">
                        <div class="left">
                            <span style="font-size:1.1rem;font-weight:600;color:#1a2e3f;">📂 未分類</span>
                            <span class="folder-count">(${data.uncategorized.length})</span>
                        </div>
                    </div>
                    <div class="uncategorized">
                        ${data.uncategorized.map(item => this._renderCard(item, null)).join('')}
                    </div>
                </div>
            `;
        }

        if (folderKeys.length === 0 && data.uncategorized.length === 0) {
            html = `<div class="empty-hint"><i class="fas fa-plus-circle" style="font-size:2rem;color:#c0d0dc;display:block;margin-bottom:8px;"></i>點擊「新增視窗」或「新增分類」開始建立您的工具集</div>`;
        }

        container.innerHTML = html;
        this.save();
        this.updateModalFolderSelect();
    },

    _renderFolder(folder) {
        const key = folder.name;
        const count = folder.items.length;
        return `
            <div class="folder" data-folder="${key}">
                <div class="folder-header">
                    <div class="left">
                        <span style="font-size:1.2rem;">📁</span>
                        <input class="folder-name" value="${this._escape(key)}" 
                               onchange="App.renameFolder('${this._escape(key)}', this.value)" 
                               onfocus="this.select()" />
                        <span class="folder-count">(${count})</span>
                    </div>
                    <div class="folder-actions">
                        <button onclick="App.addLinkToFolder('${this._escape(key)}')" title="在此分類新增視窗"><i class="fas fa-plus"></i></button>
                        <button class="del-folder" onclick="App.deleteFolder('${this._escape(key)}')" title="刪除分類"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
                <div class="folder-body">
                    ${folder.items.map(item => this._renderCard(item, key)).join('')}
                    ${folder.items.length === 0 ? '<div style="color:#b0c0cc;font-size:13px;padding:12px 0;grid-column:1/-1;text-align:center;">此分類尚無項目</div>' : ''}
                </div>
            </div>
        `;
    },

    _renderCard(item, folderKey) {
        const icon = item.icon || 'globe';
        return `
            <div class="tool-card" data-id="${item.id}" data-folder="${folderKey || ''}">
                <div class="icon"><i class="fas fa-${icon}"></i></div>
                <input class="card-name" value="${this._escape(item.name)}" 
                       onchange="App.renameItem(${item.id}, this.value)" 
                       onfocus="this.select()" />
                <input class="card-url" value="${this._escape(item.url)}" 
                       onchange="App.updateUrl(${item.id}, this.value)" 
                       onfocus="this.select()" placeholder="網址..." />
                <div class="card-actions">
                    <button class="open-link" onclick="App.openLink(${item.id})" title="在新分頁開啟"><i class="fas fa-external-link-alt"></i> 開啟</button>
                    <button class="del-card" onclick="App.deleteItem(${item.id})" title="刪除"><i class="fas fa-times"></i></button>
                </div>
            </div>
        `;
    },

    _escape(str) {
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    },

    _findItem(id) {
        let idx = this.data.uncategorized.findIndex(i => i.id === id);
        if (idx !== -1) return { location: 'uncategorized', index: idx, item: this.data.uncategorized[idx] };
        for (const key of Object.keys(this.data.folders)) {
            const folder = this.data.folders[key];
            const i = folder.items.findIndex(it => it.id === id);
            if (i !== -1) return { location: 'folder', folderKey: key, index: i, item: folder.items[i] };
        }
        return null;
    },

    // ----- 新增 -----
    addLink() {
        this._openModal('新增視窗', '請輸入名稱與網址', 'link');
    },

    addLinkToFolder(folderKey) {
        this._openModal(`新增視窗至「${folderKey}」`, '請輸入名稱與網址', 'link', folderKey);
    },

    addFolder() {
        this._openModal('新增分類', '請輸入分類名稱', 'folder');
    },

    _openModal(title, sub, mode, folderKey) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalSub').textContent = sub;
        document.getElementById('modalName').value = '';
        document.getElementById('modalUrl').value = '';
        const isFolder = mode === 'folder';
        document.getElementById('modalUrl').style.display = isFolder ? 'none' : 'block';
        document.getElementById('urlLabel').style.display = isFolder ? 'none' : 'block';
        this.updateModalFolderSelect(folderKey);
        document.getElementById('modalOverlay').classList.add('active');
        this._modalMode = mode;
        this._modalFolderKey = folderKey || null;
        document.getElementById('modalConfirmBtn').textContent = isFolder ? '建立分類' : '新增';
        setTimeout(() => document.getElementById('modalName').focus(), 100);
    },

    closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
    },

    confirmModal() {
        const name = document.getElementById('modalName').value.trim();
        const url = document.getElementById('modalUrl').value.trim();
        const folder = document.getElementById('modalFolder').value;

        if (!name) { alert('請輸入名稱'); return; }

        if (this._modalMode === 'folder') {
            if (this.data.folders[name]) {
                alert(`分類「${name}」已存在`);
                return;
            }
            this.data.folders[name] = { name: name, items: [] };
            this.save();
            this.render();
            this.closeModal();
            return;
        }

        if (!url) { alert('請輸入網址'); return; }
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            alert('請輸入有效的網址 (需以 http:// 或 https:// 開頭)');
            return;
        }

        const newItem = { id: this._nextId(), name: name, url: url, icon: 'globe' };

        if (folder && this.data.folders[folder]) {
            this.data.folders[folder].items.push(newItem);
        } else {
            this.data.uncategorized.push(newItem);
        }

        this.save();
        this.render();
        this.closeModal();
    },

    // ----- 重新命名 -----
    renameItem(id, newName) {
        const found = this._findItem(id);
        if (!found) return;
        if (!newName.trim()) { alert('名稱不能為空'); this.render(); return; }
        found.item.name = newName.trim();
        this.save();
        this.render();
    },

    renameFolder(oldKey, newKey) {
        if (!newKey.trim()) { alert('名稱不能為空'); this.render(); return; }
        if (newKey !== oldKey && this.data.folders[newKey]) {
            alert(`分類「${newKey}」已存在`);
            this.render();
            return;
        }
        const folder = this.data.folders[oldKey];
        if (!folder) return;
        delete this.data.folders[oldKey];
        folder.name = newKey.trim();
        this.data.folders[newKey.trim()] = folder;
        this.save();
        this.render();
    },

    updateUrl(id, newUrl) {
        const found = this._findItem(id);
        if (!found) return;
        if (!newUrl.trim()) { alert('網址不能為空'); this.render(); return; }
        if (!newUrl.startsWith('http://') && !newUrl.startsWith('https://')) {
            alert('請輸入有效的網址 (需以 http:// 或 https:// 開頭)');
            this.render();
            return;
        }
        found.item.url = newUrl.trim();
        this.save();
        this.render();
    },

    // ----- 刪除 -----
    deleteItem(id) {
        if (!confirm('確定要刪除這個項目嗎？')) return;
        const found = this._findItem(id);
        if (!found) return;
        if (found.location === 'uncategorized') {
            this.data.uncategorized.splice(found.index, 1);
        } else {
            this.data.folders[found.folderKey].items.splice(found.index, 1);
        }
        this.save();
        this.render();
    },

    deleteFolder(key) {
        if (!confirm(`確定要刪除分類「${key}」嗎？\n裡面的項目將移到「未分類」。`)) return;
        const folder = this.data.folders[key];
        if (!folder) return;
        for (const item of folder.items) {
            this.data.uncategorized.push(item);
        }
        delete this.data.folders[key];
        this.save();
        this.render();
    },

    // ----- 開啟連結 -----
    openLink(id) {
        const found = this._findItem(id);
        if (!found) return;
        window.open(found.item.url, '_blank');
    },

    // ----- 還原 -----
    resetAll() {
        if (!confirm('確定要還原為預設設定嗎？\n您所有的自訂項目將會遺失！')) return;
        this.setDefaultData();
        this.save();
        this.render();
        this.updateModalFolderSelect();
        this._showFixNotice('✅ 已還原為預設值');
    },

    clearStorage() {
        if (!confirm('確定要清除所有儲存資料嗎？\n這會將入口恢復為預設狀態。')) return;
        localStorage.removeItem('inhaler_portal_data');
        this.setDefaultData();
        this.save();
        this.render();
        this.updateModalFolderSelect();
        this._showFixNotice('✅ 已清除舊資料，恢復為預設值');
    },

    // ----- Modal 下拉選單 -----
    updateModalFolderSelect(selected) {
        const sel = document.getElementById('modalFolder');
        const current = sel.value;
        sel.innerHTML = '<option value="">— 不分類 —</option>';
        for (const key of Object.keys(this.data.folders)) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            sel.appendChild(opt);
        }
        if (selected) sel.value = selected;
        else if (current && this.data.folders[current]) sel.value = current;
    },

    // ----- Modal 關閉 -----
    _setupModalClose() {
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) this.closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') this.closeModal();
        });
    },
};

// ============================================================
//  啟動
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    App.init();
});
</script>
</div>
</body>
</html>
